[project]
name = "maru-lang"
version = "0.0.0"
description = "Filesystem retrieval server with HTTP API and MCP transports"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "KC ML2"},
]
keywords = ["retrieval", "filesystem", "mcp", "api", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Web framework
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "fastapi-pagination>=0.12.0",
    # ORM / PostgreSQL + pgvector
    "tortoise-orm[asyncpg]>=1.1.8,<2.0",
    "pgvector>=0.5.0,<1.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib>=1.7.4",
    # HTTP
    "httpx>=0.24.0",
    # MCP (KorDoc parser; activated by kordoc_mcp_enabled). The KorDoc server
    # itself runs via `npx -y kordoc mcp`; this is the Python stdio client.
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = {find = {where = ["."], include = ["maru_lang*"]}}
include-package-data = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
# Default: skip integration tests that require external services.
addopts = "-m 'not integration'"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
markers = [
    "integration: integration tests that require external services",
]

[tool.coverage.run]
source = ["maru_lang"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == '__main__':",
]
