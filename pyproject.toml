[project]
name = "maru-lang"
version = "0.0.0"
description = "A deterministic, team-scoped filesystem access layer for AI agents"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "KC ML2"},
]
keywords = ["filesystem", "search", "agents", "team", "mcp", "fastapi", "ripgrep"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Web framework
    "fastapi>=0.137.0,<1.0",
    "email-validator>=2.3.0,<3.0",
    "uvicorn>=0.49.0,<1.0",
    # ORM / PostgreSQL authorization metadata
    "tortoise-orm[asyncpg]>=1.1.8,<2.0",
    # Auth
    "python-jose[cryptography]>=3.5.0,<4.0",
    # MCP server transport and tools
    "mcp>=1.28.0,<2.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = {find = {where = ["."], include = ["maru_lang*"]}}
include-package-data = true
